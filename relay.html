<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>relay</title></head><body><script>
(async()=>{const p=new URLSearchParams(location.search);const src=p.get('src');if(!src||!/^\/assets\//.test(src))return;
const b=await (await fetch(src)).arrayBuffer();const t=window.parent!==window?window.parent:window.opener;
if(t)t.postMessage({relay:src,buf:b},'*',[b]);document.body.textContent='sent '+b.byteLength;})();
</script></body></html>
